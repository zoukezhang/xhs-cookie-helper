<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书 Cookie 提取器</title>
  <!-- Removed Tailwind CDN to avoid CSP issues -->
  <style>
    /* Reset & Base */
    * { box-sizing: border-box; }
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Utilities - mocking Tailwind */
    .bg-gray-50 { background-color: #f9fafb; }
    .bg-gray-200 { background-color: #e5e7eb; }
    .bg-white { background-color: #ffffff; }
    .bg-red-500 { background-color: #ef4444; }
    .bg-gray-800 { background-color: #1f2937; }
    .bg-yellow-100 { background-color: #fef3c7; }
    .bg-green-100 { background-color: #dcfce7; }
    
    .text-red-600 { color: #dc2626; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-400 { color: #9ca3af; }
    .text-gray-700 { color: #374151; }
    .text-blue-500 { color: #3b82f6; }
    .text-white { color: #ffffff; }
    .text-yellow-600 { color: #d97706; }
    .text-green-600 { color: #16a34a; }
    
    .p-4 { padding: 1rem; }
    .p-3 { padding: 0.75rem; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mt-4 { margin-top: 1rem; }
    .mr-2 { margin-right: 0.5rem; }
    
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .justify-center { justify-content: center; }
    .gap-2 { gap: 0.5rem; }
    .flex-1 { flex: 1; }
    
    .h-full { height: 100%; }
    .w-full { width: 100%; }
    .w-6 { width: 1.5rem; }
    .h-6 { height: 1.5rem; }
    /* Escape brackets for CSS class selectors */
    .h-\[300px\] { height: 300px; }
    
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
    .text-xs { font-size: 0.75rem; line-height: 1rem; }
    .text-\[10px\] { font-size: 10px; }
    
    .font-bold { font-weight: 700; }
    .font-medium { font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    
    .rounded-full { border-radius: 9999px; }
    .rounded-lg { border-radius: 0.5rem; }
    
    .border { border-width: 1px; border-style: solid; }
    .border-gray-200 { border-color: #e5e7eb; }
    
    .overflow-auto { overflow: auto; }
    .break-all { word-break: break-all; }
    .relative { position: relative; }
    
    /* Interactive */
    .hover\:bg-red-600:hover { background-color: #dc2626; }
    .hover\:bg-black:hover { background-color: #000000; }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button { cursor: pointer; border: none; }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e5e7eb;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-gray-50 p-4">
  <div class="flex flex-col h-full">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xl font-bold text-red-600 flex items-center">
        <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-6h2v6zm0-8h-2V7h2v2zm4 8h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        XHS Cookie Helper
      </h1>
      <span id="status-badge" class="px-2 py-1 text-xs font-medium bg-gray-200 text-gray-600 rounded-full">未检测</span>
    </div>

    <!-- Instructions -->
    <p class="text-gray-500 text-sm mb-4">
      请先在浏览器登录 <span class="text-blue-500 font-medium">xiaohongshu.com</span>，然后点击下方按钮。
    </p>

    <!-- Actions -->
    <div class="flex gap-2 mb-4">
      <button id="fetch-btn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center">
        获取 Cookie
      </button>
      <button id="copy-btn" class="flex-1 bg-gray-800 hover:bg-black text-white font-bold py-2 px-4 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        一键复制
      </button>
    </div>

    <!-- Data Display -->
    <div class="flex-1 relative">
      <div id="cookie-container" class="w-full h-[300px] bg-white border border-gray-200 rounded-lg p-3 overflow-auto custom-scrollbar text-xs font-mono break-all text-gray-700">
        等待获取数据...
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-4 text-center">
      <p class="text-[10px] text-gray-400">仅供个人学习使用，请妥善保管您的 Cookie 信息，切勿发给他人。</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
